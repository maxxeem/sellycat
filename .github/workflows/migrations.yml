name: Supabase migrations

# Staging first, production only on release (same as SwypeCast): every push to another branch
# applies supabase/migrations to sellycat-staging; a push to `release` (the Vercel production
# branch) applies them to production. Repository secrets: SUPABASE_ACCESS_TOKEN,
# SUPABASE_DB_PASSWORD_STAGING, SUPABASE_DB_PASSWORD_PRODUCTION. Repository variables:
# SUPABASE_REF_STAGING (set 16.11.2026), SUPABASE_REF_PRODUCTION (with the production project).
on:
  push:
    branches: ["**"]
    paths: ["supabase/migrations/**", ".github/workflows/migrations.yml"]
  workflow_dispatch:

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ github.ref == 'refs/heads/release' && secrets.SUPABASE_DB_PASSWORD_PRODUCTION || secrets.SUPABASE_DB_PASSWORD_STAGING }}
      TARGET_NAME: ${{ github.ref == 'refs/heads/release' && 'production' || 'staging' }}
      TARGET_REF: ${{ github.ref == 'refs/heads/release' && vars.SUPABASE_REF_PRODUCTION || vars.SUPABASE_REF_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link ${{ env.TARGET_NAME }}
        run: supabase link --project-ref "$TARGET_REF"
      - name: Dry run
        run: supabase db push --linked --dry-run
      - name: Apply migrations to ${{ env.TARGET_NAME }}
        run: supabase db push --linked --yes
